  revision: a39f36b100fe8a5377810d56c3f4789b9c53ac42
  local_path: .local/hf/pythia-70m
training:
  device: cpu
  dtype: float32
  seed: 42
  learning_rate: 0.0003
  batch_size: 4
  epochs: 3
  max_sequence_length: 256
  max_examples: 1500
  weight_decay: 0.01
  max_grad_norm: 1.0
  cpu_threads: 4
  interop_threads: 1
  optimizer: AdamW
  betas:
  - 0.9
  - 0.999

name: Ordered checks and Release model gate
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published model Release tag
        type: string
        required: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      bad_model:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.14.4
      - run: ruff check .
  unit:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only dependencies
        run: |
          pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-service-dev.txt
      - run: python -m pytest -q
  model-evaluation:
    needs: unit
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag || vars.MODEL_RELEASE_TAG }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPO: ${{ github.repository }}
      BAD_MODEL: ${{ inputs.bad_model || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only dependencies
        run: |
          pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-service-dev.txt
      - name: Download actual published Release asset (no fallback)
        run: |
          test -n "$RELEASE_TAG" || { echo 'Configure MODEL_RELEASE_TAG or dispatch with release_tag'; exit 1; }
          mkdir -p .local/release-download
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --dir .local/release-download --pattern 'pythia-70m-v1.tar.gz*'
      - name: Verify trusted checksums and generate all 100 raw predictions
        run: |
          extra=()
          if [ "$BAD_MODEL" = true ]; then extra+=(--bad-model); fi
          python -m ci.evaluate_release --archive .local/release-download/pythia-70m-v1.tar.gz "${extra[@]}"
          python tools/score.py results/ci/predictions.jsonl data/validation.jsonl --out results/ci/evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: results/ci/
  quality-gate:
    needs: model-evaluation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: evaluation
          path: results/ci/
      - name: Require at least 95 percent JSON validity
        run: |
          set -o pipefail
          python tools/score.py results/ci/predictions.jsonl data/validation.jsonl --min-validity 95 --out results/ci/gate.json 2>&1 | tee results/ci/gate.log
      - name: Record actual run URL
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: printf '%s\n' "$RUN_URL" > results/ci/run-url.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-evidence
          path: results/ci/
  secret-scan:
    needs: quality-gate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks full Git history, redacted output
        run: |
          mkdir -p results/ci
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.3 git --no-banner --redact --report-format json --report-path results/ci/gitleaks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan
          path: results/ci/gitleaks.json
